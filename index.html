<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escolha a Versão - Agência Maria Lina</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            background-color: #000;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 800px;
            padding: 20px;
        }
        h1 {
            color: #00ff08;
            margin-bottom: 40px;
        }
        .options {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            display: inline-block;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            color: #000;
            background-color: #00ff08;
            text-decoration: none;
            border-radius: 30px;
            transition: all 0.3s;
        }
        .btn:hover {
            background-color: #00cc06;
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(0, 255, 8, 0.5);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Bem-vindo ao Portfólio da Maria Lina</h1>
        <p style="margin-bottom: 40px; font-size: 18px;">Este projeto foi desenvolvido em duas versões distintas para comparação de frameworks CSS.</p>
        <div class="options">
            <a href="bootstrap/index.html" class="btn">Versão com Bootstrap</a>
            <a href="tailwind%20css/index.html" class="btn">Versão com Tailwind CSS</a>
        </div>
    </div>
</body>
</html>
